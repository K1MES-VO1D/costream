<!doctype html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Costream – Android preview</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #11141c; font-family: system-ui, sans-serif; }
  .phone { position: relative; width: 412px; height: 880px; background: #000; border-radius: 48px; padding: 14px; box-shadow: 0 0 0 3px #3a3f4b, 0 30px 80px rgba(0,0,0,.6); }
  .screen { position: relative; width: 100%; height: 100%; border-radius: 36px; overflow: hidden; background: #25457f; }
  .status { position: absolute; top: 0; left: 0; right: 0; height: 28px; z-index: 5; display: flex; justify-content: space-between; align-items: center; padding: 0 22px; color: #fff; font-size: 13px; font-weight: 600; pointer-events: none; }
  .cam { position: absolute; top: 9px; left: 50%; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: #000; z-index: 6; }
  iframe { position: absolute; top: 28px; left: 0; width: 100%; height: calc(100% - 28px - 20px); border: 0; touch-action: pan-x pan-y; }
  .gesture { position: absolute; bottom: 7px; left: 50%; width: 120px; height: 5px; margin-left: -60px; border-radius: 3px; background: #fff; z-index: 5; opacity: .8; pointer-events: none; }
  .nav { position: absolute; bottom: 0; left: 0; right: 0; height: 20px; background: #fff; }
  @media (max-width: 460px) { .phone { width: 100vw; height: 100vh; border-radius: 0; padding: 0; box-shadow: none; } .screen { border-radius: 0; } .cam, .status { display: none; } iframe { top: 0; height: 100%; } .gesture, .nav { display: none; } }
</style>
</head>
<body>
  <div class="phone">
    <div class="screen">
      <div class="cam"></div>
      <div class="status"><span>13:56</span><span>📶 🔋 54%</span></div>
      <iframe src="/" title="Costream"></iframe>
      <div class="nav"></div>
      <div class="gesture"></div>
    </div>
  </div>
</body>
</html>
